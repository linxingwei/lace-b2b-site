name: Import original beaded patch photos
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/import-beaded-patches.yml"
      - "scripts/download-beaded-patches.mjs"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Download and validate 29 original JPEGs
        run: node scripts/download-beaded-patches.mjs
      - name: Commit original images to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/products/beaded-patches/
          if ! git diff --cached --quiet; then
            git commit -m "assets: import 29 original beaded patch photos (RYL watermark retained)"
            git push
          fi
